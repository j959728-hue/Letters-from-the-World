name: Verify Python and Chromium
on:
  workflow_dispatch:
  push:
    paths:
      - 'briefing/**'
      - 'tests/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/**'
      - 'requirements.txt'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q briefing tests scripts
      - run: python -m pytest -q
        env:
          RUN_BROWSER_TESTS: '1'
